<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#10131b">
<title>PHONE FLIP — Симулятор перепродажи телефонов</title>
<style>
:root{color-scheme:dark;--bg:#10131b;--panel:#191e29;--panel2:#202737;--line:#30394b;--text:#f4f6fb;--muted:#9aa6ba;--green:#67e6a5;--blue:#7ca8ff;--red:#ff7885;--gold:#ffce70}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}body{overflow:hidden}button,input,select{font:inherit}button{cursor:pointer;border:0;color:inherit}.app{height:100dvh;min-height:360px;display:grid;grid-template-rows:66px 1fr 62px;max-width:1600px;margin:auto;padding:12px;gap:12px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 18px;background:var(--panel);border:1px solid var(--line);border-radius:18px;min-width:0}.brand{display:flex;align-items:center;gap:11px;font-weight:900;letter-spacing:.6px;font-size:19px;white-space:nowrap}.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#6c9cff,#9d83ff);color:#10131b;font-size:17px}.stats{display:flex;align-items:center;gap:10px}.stat{padding:8px 13px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;white-space:nowrap}.stat small{display:block;color:var(--muted);font-size:10px}.stat strong{font-size:15px}.green{color:var(--green)}.main{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;min-height:0}.sidebar{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px}.nav{padding:12px 13px;background:transparent;border-radius:12px;text-align:left;color:var(--muted);font-weight:700}.nav.active,.nav:hover{background:#2a3548;color:var(--text)}.sidebottom{margin-top:auto;color:var(--muted);font-size:11px;line-height:1.5;padding:10px}.content{min-width:0;min-height:0;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.pagehead h1{font-size:22px;margin:0 0 4px}.pagehead p{color:var(--muted);font-size:12px;margin:0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.filters input,.filters select{background:#111722;border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:11px;min-width:125px;outline:none}.filters input{flex:1;min-width:160px}.phonegrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.phonecard{background:#202737;border:1px solid #323d51;border-radius:15px;padding:12px;display:flex;flex-direction:column;min-width:0;transition:transform .15s,border-color .15s}.phonecard:hover{transform:translateY(-2px);border-color:#647ba2}.phoneart{height:94px;display:grid;place-items:center;background:radial-gradient(ellipse at center,#303d54 0,transparent 70%);margin-bottom:7px}.device{height:84px;width:47px;border:3px solid #8e9bb2;border-radius:11px;background:linear-gradient(145deg,#1a2230,#07090d);position:relative;box-shadow:0 8px 18px #0005}.device:before{content:"";position:absolute;top:4px;left:50%;transform:translateX(-50%);width:17px;height:4px;border-radius:5px;background:#8996a9}.camera{position:absolute;top:7px;left:6px;width:21px;height:25px;border-radius:6px;background:#2d3748;border:1px solid #596780}.camera:before,.camera:after{content:"";position:absolute;width:7px;height:7px;border:2px solid #9ba9bd;border-radius:50%;background:#151b25;left:2px;top:2px}.camera:after{left:10px;top:11px}.device.samsung{border-radius:9px;width:44px}.device.xiaomi{border-radius:10px}.device.huawei{border-color:#a3b0c2}.device.redmi{border-color:#ffad73}.model{font-size:14px;font-weight:800;line-height:1.25;min-height:35px}.maker{font-size:10px;color:var(--muted);margin:3px 0 8px}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}.chip{font-size:10px;padding:4px 6px;border-radius:6px;background:#303b50;color:#d7dfef}.condition.good{color:var(--green)}.condition.fair{color:var(--gold)}.condition.poor{color:var(--red)}.price{font-weight:900;font-size:17px;margin-top:auto}.price small{font-size:10px;color:var(--muted);font-weight:500}.buybtn,.actionbtn{margin-top:9px;padding:10px;border-radius:10px;background:var(--green);color:#101b17;font-weight:900;font-size:12px}.buybtn:disabled{background:#475366;color:#9aa6ba;cursor:not-allowed}.secondary{background:#303b50;color:var(--text)}.danger{background:#4b2933;color:#ffb3bc}.empty{padding:36px 15px;text-align:center;color:var(--muted);border:1px dashed #3a465b;border-radius:14px}.bottomnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:16px}.bottomnav button{background:transparent;color:var(--muted);border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:800;min-width:0}.bottomnav button .navicon{font-size:18px;line-height:1.1}.bottomnav button.active{background:#2a3548;color:var(--green)}.bottomnav button:active{transform:scale(.98)}.inventorylist,.saleslist{display:grid;gap:9px}.rowitem{display:flex;align-items:center;gap:12px;padding:12px;background:var(--panel2);border:1px solid var(--line);border-radius:13px}.miniart{width:45px;height:58px;flex:none;display:grid;place-items:center;background:#151b25;border-radius:10px}.miniart .device{transform:scale(.55)}.rowinfo{flex:1;min-width:0}.rowinfo strong{display:block;font-size:13px}.rowinfo small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.rowprice{font-weight:900;white-space:nowrap}.rowitem .actionbtn{margin:0 0 0 8px;white-space:nowrap}.profilegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.profilebox{padding:17px;background:var(--panel2);border:1px solid var(--line);border-radius:14px}.profilebox small{color:var(--muted)}.profilebox h2{font-size:25px;margin:8px 0}.progress{height:8px;background:#111722;border-radius:8px;overflow:hidden;margin-top:10px}.progress span{display:block;height:100%;background:linear-gradient(90deg,#719bff,#6ee6b0);width:0}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#e9fff4;color:#11251a;padding:12px 18px;border-radius:12px;box-shadow:0 10px 30px #0008;z-index:10;font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}.orientation{display:none}
@media(max-width:900px){.app{padding:8px;gap:8px;grid-template-rows:56px minmax(0,1fr) 52px}.main{grid-template-columns:minmax(0,1fr);gap:8px}.content{padding:12px}.phonegrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.topbar{padding:0 12px}.stat{padding:6px 9px}.brand{font-size:16px}.sidebar{padding:8px}.nav{padding:10px;font-size:12px}}
@media(max-height:500px) and (orientation:landscape){.app{grid-template-rows:48px minmax(0,1fr) 50px;padding:6px;gap:6px}.topbar{border-radius:13px}.logo{width:30px;height:30px}.content{padding:10px}.phoneart{height:67px}.device{transform:scale(.78)}.phonecard{padding:8px}.main{grid-template-columns:minmax(0,1fr)}}
@media(orientation:portrait){body{overflow:hidden}.app{display:none}.orientation{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;background:radial-gradient(ellipse at top,#273957,#10131b 65%);z-index:20}.rotatebox{max-width:330px}.rotateicon{font-size:58px;margin-bottom:16px;display:block;animation:tilt 1.8s ease-in-out infinite alternate}.rotatebox h1{font-size:24px;margin:0 0 10px}.rotatebox p{color:#aab5c8;line-height:1.6;margin:0}@keyframes tilt{from{transform:rotate(0)}to{transform:rotate(90deg)}}}
@media(max-width:560px) and (orientation:landscape){.main{grid-template-columns:minmax(0,1fr)}.sidebar{display:none}.brand span:last-child{display:none}.stat{padding:5px 7px}.stat strong{font-size:12px}.stat small{font-size:9px}.stats{gap:5px}.phonegrid{grid-template-columns:repeat(3,minmax(0,1fr))}.pagehead h1{font-size:18px}.filters input,.filters select{padding:7px 8px;min-width:95px;font-size:11px}.phoneart{height:54px}.device{transform:scale(.62)}.model{font-size:11px;min-height:27px}.maker{font-size:9px}.chips{gap:3px}.chip{font-size:8px;padding:3px 4px}.price{font-size:14px}.buybtn{padding:7px;font-size:10px}}
</style>
</head>
<body>
<div class="orientation"><div class="rotatebox"><span class="rotateicon">📱 ↻</span><h1>PHONE FLIP</h1><p>Поверни устройство горизонтально, чтобы играть. Игра работает только в альбомной ориентации.</p></div></div>
<div class="app">
<header class="topbar"><div class="brand"><div class="logo">PF</div><span>PHONE FLIP</span></div><div class="stats"><div class="stat"><small>БАЛАНС</small><strong class="green" id="balance">₽ 50 000</strong></div><div class="stat"><small>ТЕЛЕФОНОВ</small><strong id="ownedCount">0</strong></div><div class="stat"><small>УРОВЕНЬ</small><strong id="level">1</strong></div></div></header>
<div class="main"><main class="content" id="content"></main></div>
<nav class="bottomnav" aria-label="Основная навигация"><button class="active" data-page="market"><span class="navicon">⌂</span><span>Главная</span></button><button data-page="avito"><span class="navicon">▣</span><span>Авито</span></button><button data-page="profile"><span class="navicon">♙</span><span>Профиль</span></button><button data-page="chats"><span class="navicon">☏</span><span>Чаты</span></button><button data-page="more"><span class="navicon">•••</span><span>Ещё</span></button></nav>
</div><div class="toast" id="toast"></div>
<script>
const START_BALANCE=50000;
const phones=[
{id:1,brand:"Apple",model:"iPhone 11",year:2019,memory:64,battery:83,condition:"Хорошее",grade:"good",price:18500,color:"#a8b9ff",kind:"apple"},
{id:2,brand:"Apple",model:"iPhone 12",year:2020,memory:128,battery:88,condition:"Отличное",grade:"good",price:26900,color:"#c5d7ff",kind:"apple"},
{id:3,brand:"Apple",model:"iPhone 13",year:2021,memory:128,battery:91,condition:"Отличное",grade:"good",price:35900,color:"#8eb2ff",kind:"apple"},
{id:4,brand:"Apple",model:"iPhone XR",year:2018,memory:64,battery:76,condition:"Есть следы",grade:"fair",price:12900,color:"#ffb77b",kind:"apple"},
{id:5,brand:"Samsung",model:"Galaxy S21",year:2021,memory:128,battery:86,condition:"Хорошее",grade:"good",price:21900,color:"#c6b5ff",kind:"samsung"},
{id:6,brand:"Samsung",model:"Galaxy A54",year:2023,memory:256,battery:96,condition:"Отличное",grade:"good",price:23900,color:"#8ee2c0",kind:"samsung"},
{id:7,brand:"Samsung",model:"Galaxy S22",year:2022,memory:128,battery:89,condition:"Хорошее",grade:"good",price:28900,color:"#a5b9ff",kind:"samsung"},
{id:8,brand:"Samsung",model:"Galaxy A52",year:2021,memory:128,battery:79,condition:"Есть следы",grade:"fair",price:13900,color:"#d7c3ff",kind:"samsung"},
{id:9,brand:"Xiaomi",model:"Xiaomi 12",year:2022,memory:256,battery:90,condition:"Хорошее",grade:"good",price:21900,color:"#ffb88c",kind:"xiaomi"},
{id:10,brand:"Xiaomi",model:"Xiaomi 13T",year:2023,memory:256,battery:97,condition:"Отличное",grade:"good",price:32900,color:"#a5dfbb",kind:"xiaomi"},
{id:11,brand:"Redmi",model:"Redmi Note 12",year:2023,memory:128,battery:94,condition:"Отличное",grade:"good",price:12900,color:"#ffbf91",kind:"redmi"},
{id:12,brand:"Redmi",model:"Redmi Note 11",year:2022,memory:128,battery:84,condition:"Хорошее",grade:"good",price:9900,color:"#f1c5ff",kind:"redmi"},
{id:13,brand:"Huawei",model:"P30 Pro",year:2019,memory:256,battery:78,condition:"Есть следы",grade:"fair",price:14900,color:"#d7d9e4",kind:"huawei"},
{id:14,brand:"Huawei",model:"Nova 10",year:2022,memory:128,battery:89,condition:"Хорошее",grade:"good",price:17900,color:"#a8c7ff",kind:"huawei"},
{id:15,brand:"Apple",model:"iPhone 14",year:2022,memory:128,battery:95,condition:"Отличное",grade:"good",price:43900,color:"#b3c5ff",kind:"apple"},
{id:16,brand:"Samsung",model:"Galaxy S23",year:2023,memory:256,battery:98,condition:"Отличное",grade:"good",price:45900,color:"#a8e2d1",kind:"samsung"}
];
let state={balance:START_BALANCE,inventory:[],sales:[],xp:0,nextId:100};
try{const saved=localStorage.getItem("phoneFlipSaveV1");if(saved){const parsed=JSON.parse(saved);if(parsed&&typeof parsed.balance==="number"&&Array.isArray(parsed.inventory)&&Array.isArray(parsed.sales))state={...state,...parsed}}}catch(e){console.warn("Save load error",e)}
let currentPage="market";
const money=n=>"₽ "+Math.round(n).toLocaleString("ru-RU");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){try{localStorage.setItem("phoneFlipSaveV1",JSON.stringify(state))}catch(e){console.warn("Save error",e)}}
function level(){return Math.floor(state.xp/250)+1}
function art(kind){return '<div class="phoneart"><div class="device '+kind+'"><div class="camera"></div></div></div>'}
function mini(kind){return '<div class="miniart"><div class="device '+kind+'"><div class="camera"></div></div></div>'}
function headerStats(){document.getElementById("balance").textContent=money(state.balance);document.getElementById("ownedCount").textContent=state.inventory.length;document.getElementById("level").textContent=level()}
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove("show"),2100)}
function go(page){currentPage=page;document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.page===page));document.querySelectorAll(".bottomnav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));render()}
function render(){headerStats();const c=document.getElementById("content");if(currentPage==="market"||currentPage==="avito")renderMarket(c);else if(currentPage==="inventory")renderInventory(c);else if(currentPage==="sales")renderSales(c);else if(currentPage==="profile")renderProfile(c);else if(currentPage==="chats")renderChats(c);else renderMore(c)}
function renderMarket(c){
c.innerHTML='<div class="pagehead"><div><h1>'+(currentPage==="avito"?"Авито — объявления":"Главная")+'</h1><p>Находи хорошие предложения и собирай свою коллекцию.</p></div><span class="chip">16 объявлений</span></div><div class="filters"><input id="search" placeholder="🔎 Поиск модели..." aria-label="Поиск модели"><select id="brandFilter" aria-label="Бренд"><option value="">Все бренды</option><option>Apple</option><option>Samsung</option><option>Xiaomi</option><option>Redmi</option><option>Huawei</option></select><select id="priceFilter" aria-label="Цена"><option value="all">Любая цена</option><option value="15000">До 15 000 ₽</option><option value="25000">До 25 000 ₽</option><option value="35000">До 35 000 ₽</option></select><select id="sortFilter" aria-label="Сортировка"><option value="recommended">Сначала выгодные</option><option value="cheap">Сначала дешевле</option><option value="expensive">Сначала дороже</option><option value="battery">Лучшая батарея</option></select></div><div class="phonegrid" id="phonegrid"></div>';
const search=document.getElementById("search"),brand=document.getElementById("brandFilter"),price=document.getElementById("priceFilter"),sort=document.getElementById("sortFilter");
const update=()=>{let list=phones.filter(p=>p.model.toLowerCase().includes(search.value.toLowerCase())||p.brand.toLowerCase().includes(search.value.toLowerCase()));if(brand.value)list=list.filter(p=>p.brand===brand.value);if(price.value!=="all")list=list.filter(p=>p.price<=Number(price.value));if(sort.value==="cheap")list.sort((a,b)=>a.price-b.price);else if(sort.value==="expensive")list.sort((a,b)=>b.price-a.price);else if(sort.value==="battery")list.sort((a,b)=>b.battery-a.battery);else list.sort((a,b)=>(a.price/(a.battery/100+0.25))-(b.price/(b.battery/100+0.25)));document.getElementById("phonegrid").innerHTML=list.length?list.map(p=>'<article class="phonecard">'+art(p.kind)+'<div class="model">'+esc(p.model)+'</div><div class="maker">'+esc(p.brand)+' · '+p.year+' год</div><div class="chips"><span class="chip">'+p.memory+' ГБ</span><span class="chip">'+p.battery+'% 🔋</span><span class="chip condition '+p.grade+'">'+p.condition+'</span></div><div class="price">'+money(p.price)+' <small>цена</small></div><button class="buybtn" data-buy="'+p.id+'" '+(state.balance<p.price?'disabled':'')+'>'+(state.balance<p.price?'Не хватает денег':'Купить телефон')+'</button></article>').join(""):'<div class="empty">Ничего не найдено. Попробуй изменить фильтры.</div>';};
[search,brand,price,sort].forEach(el=>el.addEventListener("input",update));update();
}
function renderInventory(c){c.innerHTML='<div class="pagehead"><div><h1>Мои телефоны</h1><p>Продавай телефоны, чтобы зарабатывать и повышать уровень.</p></div><span class="chip">'+state.inventory.length+' шт.</span></div>'+(state.inventory.length?'<div class="inventorylist">'+state.inventory.map(p=>'<div class="rowitem">'+mini(p.kind)+'<div class="rowinfo"><strong>'+esc(p.model)+'</strong><small>'+esc(p.brand)+' · '+p.memory+' ГБ · батарея '+p.battery+'% · куплен за '+money(p.buyPrice)+'</small><small>'+p.condition+' · можно выставить за '+money(suggestPrice(p))+'</small></div><div class="rowprice">'+money(suggestPrice(p))+'</div><button class="actionbtn" data-sell="'+p.uid+'">Продать</button></div>').join("")+'</div>':'<div class="empty"><div style="font-size:34px;margin-bottom:10px">📦</div><strong>Пока нет телефонов</strong><p>Зайди на рынок и купи свой первый телефон.</p><button class="actionbtn" data-goto="market">Открыть рынок</button></div>')}
function suggestPrice(p){return Math.round(p.buyPrice*1.13)}
function renderSales(c){c.innerHTML='<div class="pagehead"><div><h1>История продаж</h1><p>Все завершённые сделки и заработанная прибыль.</p></div><span class="chip">'+state.sales.length+' сделок</span></div>'+(state.sales.length?'<div class="saleslist">'+state.sales.slice().reverse().map(s=>'<div class="rowitem">'+mini(s.kind)+'<div class="rowinfo"><strong>'+esc(s.model)+' — продан</strong><small>Покупка: '+money(s.buyPrice)+' · Продажа: '+money(s.sellPrice)+'</small></div><div class="rowprice '+(s.profit>=0?'green':'condition poor')+'">'+(s.profit>=0?'+':'')+money(s.profit)+'</div></div>').join("")+'</div>':'<div class="empty"><div style="font-size:34px;margin-bottom:10px">💸</div><strong>Продаж пока не было</strong><p>Купи телефон на рынке, а потом продай его с прибылью.</p></div>')}
function renderProfile(c){const xpIn=state.xp%250;c.innerHTML='<div class="pagehead"><div><h1>Профиль продавца</h1><p>Твой путь к лучшему магазину электроники.</p></div></div><div class="profilegrid"><div class="profilebox"><small>ТЕКУЩИЙ УРОВЕНЬ</small><h2>⭐ '+level()+'</h2><small>Опыт: '+state.xp+' XP</small><div class="progress"><span style="width:'+(xpIn/250*100)+'%"></span></div><small>'+xpIn+' / 250 XP до следующего уровня</small></div><div class="profilebox"><small>ВСЕГО ПРОДАЖ</small><h2>'+state.sales.length+'</h2><small>Завершённых сделок</small></div><div class="profilebox"><small>ЧИСТАЯ ПРИБЫЛЬ</small><h2 class="'+(totalProfit()>=0?'green':'')+'">'+money(totalProfit())+'</h2><small>По всем продажам</small></div></div><div style="margin-top:15px;padding:17px;background:var(--panel2);border:1px solid var(--line);border-radius:14px"><h3 style="margin:0 0 8px">Как играть</h3><p style="color:var(--muted);font-size:13px;line-height:1.7;margin:0">1. Выбирай телефон на рынке по цене, состоянию и батарее.<br>2. Покупай его, если хватает баланса.<br>3. В разделе «Мои телефоны» продавай по предложенной цене.<br>4. Получай опыт, повышай уровень и наращивай капитал.<br>Прогресс сохраняется автоматически в этом браузере.</p><button class="actionbtn secondary" id="resetSave" style="margin-top:15px">Сбросить прогресс</button></div>'}
function renderChats(c){c.innerHTML='<div class="pagehead"><div><h1>Чаты</h1><p>Сообщения от покупателей и продавцов.</p></div></div><div class="empty"><div style="font-size:34px;margin-bottom:10px">💬</div><strong>Пока нет сообщений</strong><p>Когда появятся покупатели, переписка будет здесь.</p></div>'}\nfunction renderMore(c){c.innerHTML='<div class="pagehead"><div><h1>Ещё</h1><p>Дополнительные разделы игры.</p></div></div><div class="inventorylist"><div class="rowitem"><div class="miniart">💸</div><div class="rowinfo"><strong>История продаж</strong><small>Посмотри сделки и прибыль</small></div><button class="actionbtn" data-goto="sales">Открыть</button></div><div class="rowitem"><div class="miniart">📦</div><div class="rowinfo"><strong>Мои телефоны</strong><small>Управляй своим товаром</small></div><button class="actionbtn" data-goto="inventory">Открыть</button></div><div class="rowitem"><div class="miniart">⚙️</div><div class="rowinfo"><strong>Прогресс игры</strong><small>Сброс сохранения находится в профиле</small></div><button class="actionbtn secondary" data-goto="profile">Профиль</button></div></div>'}\nfunction totalProfit(){return state.sales.reduce((sum,s)=>sum+s.profit,0)}
function buy(id){const p=phones.find(x=>x.id===Number(id));if(!p)return;if(state.balance<p.price){toast("Недостаточно денег!");return}state.balance-=p.price;state.inventory.push({...p,uid:state.nextId++,buyPrice:p.price,boughtAt:Date.now()});state.xp+=10;save();render();toast("Куплен "+p.model+"!")}
function sell(uid){const i=state.inventory.findIndex(p=>p.uid===Number(uid));if(i<0)return;const p=state.inventory[i],sellPrice=suggestPrice(p),profit=sellPrice-p.buyPrice;state.balance+=sellPrice;state.inventory.splice(i,1);state.sales.push({model:p.model,brand:p.brand,kind:p.kind,buyPrice:p.buyPrice,sellPrice,profit,date:Date.now()});state.xp+=35;save();render();toast("Продано! "+(profit>=0?"Прибыль ":"Результат ")+money(profit))}
document.addEventListener("click",e=>{const buyBtn=e.target.closest("[data-buy]");if(buyBtn){buy(buyBtn.dataset.buy);return}const sellBtn=e.target.closest("[data-sell]");if(sellBtn){sell(sellBtn.dataset.sell);return}const goto=e.target.closest("[data-goto]");if(goto){go(goto.dataset.goto);return}if(e.target.id==="resetSave"){if(confirm("Точно сбросить баланс, телефоны и историю продаж?")){state={balance:START_BALANCE,inventory:[],sales:[],xp:0,nextId:100};save();go("market");toast("Прогресс сброшен")}}});
document.querySelectorAll(".nav,.bottomnav button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
render();
</script>
</body>
</html>
